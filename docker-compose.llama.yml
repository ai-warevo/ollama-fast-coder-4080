services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:full-cuda
    container_name: llama-cpp-provider
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      --server
      --host 0.0.0.0 
      --port 8080
      --load-mode none
      --flash-attn on
      --gpu-layers 99
      --cache-type-k q8_0
      --cache-type-v q8_0
      --ctx-size 65536
      --model /models/gemma-4-E4B-it-Q8_0.gguf

