# llama.cpp server for DeepSeek Harness (DSH) - RTX 4080 16GB / Ryzen 7 9800X3D / 64GB RAM
# Model: Qwen3.6-35B-A3B (MoE, ~3B active params), unsloth UD-Q4_K_XL (~20.8 GB).
# Does not fit 16GB VRAM fully -> hybrid: attention/dense + KV on GPU, overflow MoE experts on CPU RAM.
#
#   download : see README-llama.cpp.md
#   start    : docker compose -f docker-compose.llama.yml up -d
#   logs     : docker compose -f docker-compose.llama.yml logs -f llama-server
services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda   # entrypoint is already llama-server
    container_name: llama-cpp-provider
    restart: unless-stopped
    ports:
      - "8080:8080"          # DSH reaches it via http://host.docker.internal:8080/v1
    volumes:
      - ./models:/models:ro
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 10
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --api-key
      - ${LLAMACPP_API_KEY:-llamacpp}     # must equal LLAMACPP_API_KEY in dsh-home/.credentials.yaml
      - --model
      - /models/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
      - --alias
      - qwen3.6-35b-a3b                   # model id used by DSH
      # --- tool calling / chat template ---
      - --jinja                           # model's native template => proper tool_calls
      # --- context / slots ---
      - --ctx-size
      - "65536"
      - --parallel
      - "1"
      - --cache-reuse
      - "256"                             # reuse matching prompt chunks between agent turns
      - --cache-ram
      - "8192"                            # MiB of host RAM for prompt-cache checkpoints
      # --- GPU / CPU split ---
      - -fa
      - "on"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0                              # hybrid-attention model: KV is small, q8_0 is ~lossless
      - --fit
      - "on"                              # auto-picks GPU layers / MoE experts-on-CPU to fill VRAM
      - --fit-target
      - "1536"                            # MiB VRAM headroom (Windows desktop uses some)
      # Manual alternative (replace the two --fit lines with these if you want fixed placement):
      #   - --fit
      #   - "off"
      #   - --n-gpu-layers
      #   - "99"
      #   - --n-cpu-moe
      #   - "16"          # lower => more experts on GPU (faster); raise if CUDA OOM
      - --load-mode
      - none                              # read weights into RAM instead of mmap (mmap over the Windows bind mount is slow)
      - --threads
      - "8"                               # 9800X3D physical cores
      - --batch-size
      - "2048"
      - --ubatch-size
      - "1024"
      # --- sampling defaults (Qwen3.6 recommendation for precise coding) ---
      - --temp
      - "0.6"
      - --top-p
      - "0.95"
      - --top-k
      - "20"
      - --min-p
      - "0.0"
      - --presence-penalty
      - "0.0"
